<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cybersecurity Internship Finder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Cybersecurity Internship Finder</h1>
      <p>Find penetration testing internships in Egypt, remote globally, and relocation-friendly roles.</p>
    </header>

    <section class="filters">
      <input id="searchInput" type="text" placeholder="Search company, country, or keywords..." />
      <select id="locationFilter">
        <option value="all">All locations</option>
        <option value="egypt">Egypt (local)</option>
        <option value="remote">Remote (global)</option>
      </select>
      <label><input id="relocationFilter" type="checkbox" /> Relocation available</label>
      <button id="clearBtn">Clear filters</button>
    </section>

    <section>
      <h2>Internships</h2>
      <div id="resultsCount" class="count"></div>
      <div id="internshipList" class="cards"></div>
    </section>
  </main>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-top">
        <h3 class="title"></h3>
        <span class="type"></span>
      </div>
      <p class="company"></p>
      <p class="details"></p>
      <p class="tags"></p>
      <div class="actions">
        <a class="apply" target="_blank" rel="noreferrer">Apply</a>
        <button class="saveBtn" type="button">Save</button>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
